[package]
name = "paynow_zw"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Client for the Paynow Zimbabwe payment gateway"
license = "MIT"
authors = ["Believe Ralph Mataga"]
repository = "https://github.com/matagaralph/paynow-rust"
readme = "README.md"
keywords = ["paynow", "payments", "zimbabwe", "ecocash", "gateway"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = ["ureq"]
ureq = ["dep:ureq"]

[dependencies]
sha2 = { version = "0.11.1", default-features = false }
ureq = { version = "3.5.0", default-features = false, features = ["native-tls-no-default"], optional = true }

[[example]]
name = "mobile"
required-features = ["ureq"]
